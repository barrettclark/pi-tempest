[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-tempest"
version = "0.1.0"
description = "Custom Raspberry Pi weather dashboard for a WeatherFlow Tempest station"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "ephem==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.5",
    "pre-commit==4.6.2",
]

[tool.setuptools]
packages = ["api", "api.routers", "collector"]
py-modules = ["config"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Frozen planning docs — ruff 0.16+ formats fenced code blocks in Markdown.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter owns line length; E501 only nags about strings it can't split.
ignore = ["E501"]

[tool.ruff.lint.extend-per-file-ignores]
# FastAPI uses `Depends(...)` / `Query(...)` as argument defaults by design.
"api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=api --cov=collector --cov-report=term-missing"
testpaths = ["tests"]
